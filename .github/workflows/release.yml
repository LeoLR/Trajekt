name: Release @trajekt-ai/core

# Publie @trajekt-ai/core sur npm quand on pousse un tag core-vX.Y.Z
# (la version du tag doit être celle de packages/core/package.json).
# Secret requis : NPM_TOKEN (jeton npm « Automation » ou granulaire, droit de publication).
on:
  push:
    tags: ['core-v*']

permissions:
  contents: read
  id-token: write # pour --provenance, à remettre quand le repo sera public

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        working-directory: packages/core
        run: |
          v=$(node -p "require('./package.json').version")
          [ "core-v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - run: pnpm --filter @trajekt-ai/core build
      - run: pnpm --filter @trajekt-ai/core test
      - working-directory: packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
