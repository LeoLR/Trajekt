name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trajekt/core build
      - name: Library tests
        run: pnpm --filter @trajekt/core test
      - name: Dashboard tests (real SQL on Postgres)
        run: pnpm --filter dashboard test
      - name: GitHub Action tests
        run: node --test actions/eval-suite/index.test.mjs
      - name: Example eval suite — v1 passes, v2 is caught
        working-directory: packages/core
        run: |
          AGENT_VERSION=v1 pnpm exec tsx --test ../../examples/eval-suite/suite.test.ts
          if pnpm exec tsx ../../examples/eval-suite/compare.ts v1 v2; then
            echo "::error::the v2 regression should have failed the suite"; exit 1
          fi
          pnpm exec tsx ../../examples/eval-suite/compare.ts v2 v1

  e2e:
    # L'application qui tourne vraiment (next build + next start), dans un navigateur.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      DASHBOARD_PASSWORD: e2e-password
      DASHBOARD_SESSION_SECRET: e2e-session-secret-0123456789
      TRAJEKT_REDACT: secrets,email
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trajekt/core build
      - name: Database with the demo data
        run: |
          pnpm --filter dashboard migrate
          pnpm --filter dashboard seed
      - run: pnpm --filter dashboard build
      - name: Start the dashboard
        run: |
          pnpm --filter dashboard start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/login && exit 0; sleep 1; done
          cat /tmp/next.log; exit 1
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: e2e
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/e2e.out
          echo "::notice title=e2e::$(grep -E '^# (tests|pass|fail)' /tmp/e2e.out | tr '\n' ' ')"
      - name: Server log
        if: failure()
        run: tail -200 /tmp/next.log
