name: Hydration debug (temporary)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: commit de l'application à tester
        required: true
jobs:
  debug:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      DASHBOARD_PASSWORD: e2e-password
      DASHBOARD_SESSION_SECRET: e2e-session-secret-0123456789
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - run: git fetch -q origin main && git checkout -q origin/main -- e2e/hydration-debug.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trajekt/core build
      - run: |
          pnpm --filter dashboard migrate
          pnpm --filter dashboard seed
      - run: pnpm --filter dashboard build
      - name: Start next
        run: |
          pnpm --filter dashboard start > /tmp/next.log 2>&1 &
          for i in $(seq 1 90); do curl -fs -o /dev/null http://localhost:3000/login && exit 0; sleep 1; done
          cat /tmp/next.log; exit 1
      - working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          REF=${{ inputs.ref }} node hydration-debug.mjs
