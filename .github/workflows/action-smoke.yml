name: Eval suite action (smoke test)
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: evals
        uses: ./actions/eval-suite
        with:
          url: https://trajekt-demo.vercel.app
          agent: sentry-triage
          baseline: 1.4.0
          candidate: 1.5.0
          fail-on-regression: 'false'
      - run: |
          echo "result=${{ steps.evals.outputs.result }} report=${{ steps.evals.outputs.report-url }}"
          test "${{ steps.evals.outputs.result }}" = "fail"
