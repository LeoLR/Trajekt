services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trajekt
      POSTGRES_PASSWORD: trajekt
      POSTGRES_DB: trajekt
    ports:
      - "5432:5432"
    volumes:
      - trajekt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajekt"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://trajekt:trajekt@postgres:5432/trajekt
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-trajekt}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-dev-only-secret-change-me-please}
      CRON_SECRET: ${CRON_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TRAJEKT_PUBLIC_URL: ${TRAJEKT_PUBLIC_URL:-http://localhost:3000}
      TRAJEKT_PRICING: ${TRAJEKT_PRICING:-}
    ports:
      # Dashboard ET ingestion OTLP/HTTP (POST /v1/traces) sur le même port.
      - "3000:3000"

volumes:
  trajekt_pgdata:

# Un seul Postgres, deux services au total — volontairement : c'est le
# contraste avec la stack à 4 services de Langfuse v3 (Postgres +
# ClickHouse + Redis + S3).
